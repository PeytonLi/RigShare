<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispute {{ loan.id[:8] }}</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      button { display: block; width: 100%; margin: 0.5rem 0; padding: 0.75rem; font-size: 1rem; }
    </style>
  </head>
  <body>
    <h1>RigShare dispute</h1>
    <p>Loan {{ loan.id[:8] }} · {{ item.sku if item else "" }} · state {{ loan.state }}</p>
    <p>Outbound vs return. Pick one. This page is the Terac Activity URL.</p>
    <form method="post" action="/disputes/{{ loan.id }}">
      <button name="verdict" value="fine">Same item, fine</button>
      <button name="verdict" value="damaged">Same item, damaged</button>
      <button name="verdict" value="different">Different item</button>
    </form>
  </body>
</html>
