<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RigShare{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="mark">R</span>
        RigShare
      </a>
      <span class="status-chip {{ 'pass' if money_status == 'pass' else ('warn' if money_status == 'warn' else 'fail') }}">
        <span class="dot"></span>
        money: {{ money_status }}
      </span>
      <div class="spacer"></div>
      <span class="status-chip">
        <span class="dot"></span>
        {{ from_number }}
      </span>
      <span class="status-chip"><span class="dot"></span>vendors {{ ok_count }}/{{ vendor_count }}</span>
      <a class="status-chip" href="/health">/health</a>
    </header>

    <main class="wrap">
      {% block content %}{% endblock %}
    </main>

    <footer>
      RigShare · text a number · borrow gear · pay a hold · bring it back · get most of it back
    </footer>
  </body>
</html>
